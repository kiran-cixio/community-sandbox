name: "DCO Compliance Check"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO Sign-off
        run: |
          echo "Fetching full history..."
          
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Could not determine PR base/head SHAs. Skipping DCO check."
            exit 0
          fi
          
          echo "Checking commits between $BASE_SHA..$HEAD_SHA"
          
          commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi
          
          missing=0
          for c in $commits; do
            if ! git show -s --format=%B "$c" | grep -iq '^Signed-off-by:'; then
              echo "::error::Commit $c is missing a 'Signed-off-by:' line"
              missing=1
            fi
          done
          
          if [ $missing -eq 1 ]; then
            echo "DCO check failed. Add 'Signed-off-by: Your Name <you@example.com>' to commits or re-sign-off with git commit --amend -s."
            exit 1
          fi
          
          echo "DCO check passed."
